# 极限 Chat 模式：只保留联网工具，不注入任何提示词。
#
# 实测事实（DSH 0.2.2-rc.1 桌面版，2026-11-11，多轮会话 + report.json）：
#   * profile 里的插件包在 agent 层注册约 50 个工具（artifacts / research / remote /
#     session_search / terminal / render_ui / plot3d / workspace …），预设继承它们。
#   * 预设自己挂 tool-web 时，这两个工具落在**预设作用域**：对 agent 来说是继承工具，
#     对预设自己的 restrict 视图来说却是 own —— 于是 `allow: ['web_search','web_fetch']`
#     校验不过（报 unknown global tool），而 `allow: []` 又会把它们一起挡掉。
#     「只剩 3 个 sentinel」就是这么来的。
#   * 正解：让**宿主层**提供联网工具。0.2.2 的 dsh-web-app 会把宿主那行 tool-web
#     disable 掉，本机已在 profiles/desktop/cordis.patch.yml 里用
#     `- id: tool-web / disabled: false` 重新启用。宿主层的工具落在 global 层，
#     对预设视图属于继承工具，allow 名单才能校验通过。
#
# 于是组合只需要：persona（空 + complete）、本插件（allow 名单 + required 上下文遮蔽）、
# compaction。预设里不再挂 tool-web 或 web-stack。
- insert:
    - id: preset-extreme-chat
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: extreme-chat
        name: Extreme Chat
        description: 极限聊天：无系统提示词、不加载 AGENTS.md 与技能目录、无运行时上下文，只保留 web_search / web_fetch。
        order: 0
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: ''
              complete: true
              includeRuntimeContext: false
          - id: extreme-chat-no-tools
            name: dsh-extreme-chat-mode
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
